name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Plugin metadata and hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python3 scripts/check-examples.py --metadata-only
          python3 scripts/check-readme-bilingual.py
          sh hooks/detect-db.test.sh
      # 루트 CLAUDE.md 경고는 개발용 파일이라 의도된 것이므로 그 경고만 빼고 모두 실패로 본다.
      - name: Claude Code plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.282
          claude plugin validate --strict .
          claude plugin validate --json .claude-plugin/plugin.json | python3 -c '
          import json, sys
          report = json.load(sys.stdin)
          issues = [
              item["message"]
              for entry in [report["manifest"], *report["contents"]]
              for item in entry["errors"] + entry["warnings"]
              if not item["message"].startswith("CLAUDE.md at the plugin root")
          ]
          sys.exit("\n".join(issues) if issues or not report["success"] else 0)
          '

  examples:
    name: PostgreSQL ${{ matrix.postgres }} and MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 신규 구성 기본값(최신 PG major + 최신 MySQL LTS)과 기존 설치 호환 조합을 한 잡씩 돌린다.
        include:
          - postgres: 18
            mysql: "9.7"
          - postgres: 16
            mysql: "8.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # 테스트 의존성은 전역 설치 없이 uv가 실행 시점의 격리 환경으로 공급한다.
      # lockfile·requirements가 없어 캐시가 자동 무효화되지 않으므로 끈다(기존 pip 단계도 캐시 없음).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: 문서 예제 실행
        env:
          PG_MAJOR: ${{ matrix.postgres }}
          MYSQL_VERSION: ${{ matrix.mysql }}
        run: |
          pg_tag="${PG_MAJOR}-alpine"
          if [ "$PG_MAJOR" = 18 ]; then
            pg_tag="${PG_MAJOR}-bookworm"
          fi
          # ECR 요청 제한 시 같은 공식 이미지를 Docker Hub에서 받는다.
          for image in "postgres:$pg_tag" "mysql:$MYSQL_VERSION"; do
            mirror="public.ecr.aws/docker/library/$image"
            if ! docker pull "$mirror"; then
              docker pull "$image"
              docker tag "$image" "$mirror"
            fi
          done
          args=(--pg-major "$PG_MAJOR" --mysql "$MYSQL_VERSION")
          if [ "$PG_MAJOR" = 18 ]; then
            docker build -f scripts/Dockerfile.postgres -t easy-rdbms-examples-pg18 .
            args+=(--extensions)
          fi
          uv run --no-project --with 'Django>=5.2,<5.3' --with 'psycopg[binary]>=3,<4' \
            python scripts/check-examples.py "${args[@]}"
